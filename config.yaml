# Global Trend Radar 配置
# 扫描间隔（分钟），Windows / macOS 本地运行，默认 15 分钟
# 免费优先：默认启用 RSS；GDELT 已停用（见下）；新闻 API 与
# Reddit/YouTube 需配置凭证后自动采集，无凭证时显示未启用。
# 付费来源（X）只有在没有免费可选方案时才考虑开启。
scan_interval_minutes: 15
db_path: "data/trends.sqlite3"

# 权重是初始假设，需用真实数据校准
weights:
  growth: 0.30
  scale: 0.20
  acceleration: 0.20
  cross_platform: 0.20
  novelty: 0.10

# 搜索主题（见 docs/TOPICS.md）：所有需要关键词的来源共用——
# Google News / Bing RSS 搜索 feed、免费新闻 API、GDELT 查询词。
# 全部是英文关键词（所有来源都是英文内容，中文关键词匹配不到东西）。
# 改主题不用改代码：改这里，重启扫描器即可。
# YouTube 不走这里：搜索桶 100 次/天，最多 2 个查询词（见下文 youtube）。
topics:
  breaking: ["breaking news"]  # 突发最热
  economy: ["stock market OR inflation OR interest rates"]  # 经济金融
  tech: ["technology"]  # 科技
  ai: ["artificial intelligence OR AI"]  # AI
  politics: ["war OR geopolitics"]  # 全球政治与冲突

sources:
  rss:
    enabled: true
    # 免费 RSS 源（2026-11-15 实测可用，均无需 key；失败的源会被跳过
    # 并记一条 warning，不影响本轮）。Google News 背后是几百家媒体，
    # 它的链接是 news.google.com 的跳转地址，同一事件在不同查询里
    # 可能出现两次，聚类会把它们并成一个事件。
    # 未加入的：路透社 rssFeed 返回 401（可能挡云服务器 IP，用户 Mac
    # 上浏览器能打开的话可以再加）、美联社 apnews.com/rss 连接失败。
    # aggregators: true 时，Google News（头条 + 每个主题 1 个搜索 feed）
    # 与 Bing（每个主题 1 个搜索 feed）由 topics 现场生成，见
    # trend_radar/topics.py；false 则只采下面列出的出版商 feed。
    aggregators: true
    feeds:
      - "https://feeds.bbci.co.uk/news/world/rss.xml"
      - "https://feeds.bbci.co.uk/news/technology/rss.xml"
      # 综合新闻
      - "https://www.aljazeera.com/xml/rss/all.xml"
      # 科技
      - "https://news.ycombinator.com/rss"
      - "https://techcrunch.com/feed/"
      - "https://www.theverge.com/rss/index.xml"
  gdelt:
    # 2026-11-15 已停用：Doc API 持续限流——当天本机 3 次失败（429×2 +
    # 限流提示文本×1），云服务器 IP 多次 429，用户手机上试最小窄查询
    #（technology、英文、1 天、10 条）同样返回限流提示。IP 和查询范围
    # 都已排除，是 GDELT 服务端过载主动丢请求（见 docs/GDELT 研究）。
    # 停用后每轮不再浪费重试时间；GDELT 本来就没有互动量数据，停用
    # 对增长计算没有损失。以后想再试：把下面改回 true 即可；先在
    # 浏览器打开窄查询地址确认返回 JSON 再开。重开时查询词由 topics
    # 自动拼成（见 trend_radar/topics.py），这里不用写 query。
    enabled: false
    max_records: 50
    # GDELT 单独放宽到每 60 分钟 1 次（不是每 15 分钟）：2026-11-15 连续 3 次
    # 失败（两次 HTTP 429、一次返回限流提示文本而非 JSON），见
    # trend_radar/adapters/gdelt.py。GDELT 没有互动量数据，降频对增长
    # 计算几乎没有损失；被限流后 gdelt.py 内部还会退避重试（最多 3 次）。
    interval_minutes: 60
  reddit:
    enabled: true  # 已开启：无凭证时 adapter 返回 [] 并记“未启用”，填好 REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET 后自动采集
    subreddits:
      - "worldnews"
      - "technology"
  youtube:
    enabled: true  # 已开启：无凭证时 adapter 返回 [] 并记“未启用”，填好 YOUTUBE_API_KEY 后自动采集
    queries:
      - "breaking news"
      - "artificial intelligence"
    # 2026-11-15 用户决定：technology → artificial intelligence。AI 是
    # 明确的优先方向，纯 AI 视频的标题不一定带 technology 这个词；
    # 通用科技内容仍由 TechCrunch / Verge / Hacker News RSS 与 Google
    # News 科技搜索 feed 覆盖。用精确短语，不用 OR 写法（YouTube 搜索
    # 不支持 OR；OR 写法只适合 Google/Bing 等支持 OR 的来源）。
    # YouTube 单独放宽到每 30 分钟 1 次（不是每 15 分钟）：2 个查询词 × 48 次/天 = 96 次搜索/天，
    # 搜索桶上限是 100 次/天（Google 官方配额，2026-06-01 起 search.list 单独成桶、每次 1 单位），留 4 次缓冲。
    # videos.list 每次 1 单位，共用池 10,000 units/天，96 次只占 96 units。配额每天太平洋时间午夜重置。
    # 原配置 2 词 × 96 次/天 = 192 次搜索/天，接通当天就可能超限。见 trend_radar/collector.py。
    interval_minutes: 30
  x:
    enabled: false  # 配置 X_BEARER_TOKEN 后改为 true（按付费服务处理）
    queries:
      - "breaking news"
  tiktok:
    enabled: false  # 需要官方授权数据接口，当前为预留 stub，不采集
    queries: []
  # 免费新闻 API（见 docs/NEWS_APIS.md）：查询词全部来自上面 topics
  #（默认 5 个），每个来源单独限频；无 key 时返回 []、不发请求，
  # 填好 key 后下一轮自动开始采集。启用的前提是 key 已填进本地 .env。
  newsapi:
    enabled: true  # NEWSAPI_KEY；免费 100 次/天、文章延迟约 24 小时、仅限开发测试
    # 90 分钟 1 次：16 轮/天 × 5 个查询 = 80 次/天，余 20。
    interval_minutes: 90
  guardian:
    enabled: true  # GUARDIAN_API_KEY；免费 500 次/天、1 次/秒、非商业用途
    # 15 分钟 1 次：96 轮/天 × 5 个查询 = 480 次/天，余 20。
    interval_minutes: 15
  nyt:
    enabled: true  # NYT_API_KEY；免费 500 次/天、5 次/分钟、非商业用途
    # 15 分钟 1 次：96 轮/天 × 5 个查询 = 480 次/天，余 20；
    # 每轮内两次调用之间隔 12 秒（见 adapters/nyt.py）。
    interval_minutes: 15
  newsdata:
    enabled: true  # NEWSDATA_API_KEY；免费 200 credits/天、文章延迟 12 小时
    # 45 分钟 1 次：32 轮/天 × 5 个查询 = 160 credits/天，余 40。
    interval_minutes: 45

# P3 Telegram 实时提醒（免费 Bot API）：爆发事件在 1 分钟内推送到 Telegram。
# 凭证不放这里，放本地 .env：TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID。
# 未配凭证时自动跳过、不发任何请求；enabled: false 可彻底关闭提醒。
# 设置步骤见 docs/P3_ALERTS.md。
telegram:
  enabled: true

# Muse 对话提醒（2026-11-15）：爆发事件在发 Telegram 提醒的同时，
# 也打进用户自己 Chrome 里的 Muse 对话输入框并发送，消息首行是
# 结构化标记（见 docs/MUSE_CHAT.md）。只受这里的 enabled 控制，
# 与 telegram.enabled 无关。macOS 用 AppleScript（不用重启 Chrome，
# 首次运行要在系统设置 → 隐私与安全性 → 自动化里允许扫描器控制
# Chrome）；Windows 用 CDP（Chrome 要完全退出后加
# --remote-debugging-port=9222 重开，见 docs/MUSE_CHAT.md）。
# 提醒是以用户的名义发出的，首行标记用于区分扫描器消息和用户手打消息。
muse_chat:
  enabled: true
  url_match: "muse.ai"
  method: auto  # auto | applescript | cdp | safari；auto = macOS 用 AppleScript，Windows 用 CDP；macOS 也可填 safari 走 Safari（2026-11-15 起 Chrome 的 AppleScript 在本机不可用，见 docs/MUSE_CHAT.md）
  cdp_port: 9222

# 每日质量简报（2026-11-16，见 docs/QUALITY_DIGEST.md）：每天早上 hour 点
# （调度器本地时间）把昨日的质量摘要打进 Muse 对话（走 muse_chat 的
# 发送通道），让 Cheese 收到后分析并优化。muse_chat 没启用时不发；
# enabled: false 可彻底关闭。内容：Top 5 事件、当日计数（事件/爆发/
# 重复抑制/Telegram/Muse 发送数）、质量信号（Top 10 单平台数、
# hashtag 占比高的事件数、recurrence 事件数）。轮次计数存在
# data/.quality_daily.json（只保留昨天和今天），不进仓库。
quality_digest:
  enabled: true
  hour: 8

# 标题自动翻译：只翻优先内容（Top 5 事件名 + 爆发事件名 + 各事件最高分
# 成员标题），其他内容保持英文。Azure 主用、每轮都跑（每轮 600 字符硬
# 上限 + 每月 180 万字符上限，用 data/.azure_usage.json 计数）；
# DeepL 备用、每小时最多 1 次（state 文件 data/.deepl_last_run）。
# key 放本地 .env（AZURE_TRANSLATOR_KEY / DEEPL_API_KEY）。
# 翻译结果缓存在数据库（items.title_zh / events.name_zh），同一标题只翻
# 一次；失败不存，下一轮再试。见 docs/TRANSLATION.md。
translation:
  enabled: true
  target_lang: zh-CN
  # 只翻优先内容（见 docs/TRANSLATION.md）：Top 5 事件名 + 爆发事件名 +
  # 各事件分数最高的成员标题，其他内容保持英文。Azure 每轮都跑（15 分钟
  # 一轮就翻一次），用量靠两层封顶：每轮 600 字符（600 × 96 轮/天 × 31 天
  # = 1,785,600 < 1,800,000）+ 每月 1,800,000 字符（data/.azure_usage.json
  # 计数，用完本轮跳过 Azure、改走 DeepL）。azure_max_per_round /
  # deepl_max_per_round 是每轮各提供方最多翻的文本条数；DeepL 每小时
  # 最多 1 次（一次性 100 万字符总额，经不起每轮跑）。key 放本地 .env：
  # AZURE_TRANSLATOR_KEY（+ 区域资源才填 AZURE_TRANSLATOR_REGION）、
  # DEEPL_API_KEY；都没配时不翻译。
  azure_max_per_round: 15
  deepl_max_per_round: 15
  azure_max_chars_per_round: 600
  azure_monthly_cap_chars: 1800000

# P1 事件聚类 v0.1（本地 TF-IDF + 余弦相似度 + 并查集，无新依赖）
# similarity_threshold 是初始假设，需用真实多平台数据校准，见 docs/P1_CLUSTERING.md
clustering:
  similarity_threshold: 0.35
  min_platforms: 1
  time_window_hours: 24

# P2 准备：爆发检测阈值（初始假设，需用真实快照数据校准，见 docs/P2_PREP.md）
# growth_spike：最新 max_growth 相对上一轮翻 growth_multiplier 倍以上，
#   且绝对增量不小于 growth_min_delta；score_surge 同理；
# new_event_min_platforms：首次出现即跨 >= 该数个平台的事件视为爆发。
burst:
  growth_multiplier: 2.0
  growth_min_delta: 100.0
  score_multiplier: 2.0
  score_min_delta: 5.0
  new_event_min_platforms: 2
  # 新事件跨平台的最低质量门槛（2026-11-15，2026-11-16 条数腿 10 -> 20）：
  # 条数 >= 20 或总分 >= 5.0，满足其一才算爆发。2026-11-16 生产实测：
  # 11 条/2.94 分的小丑短视频靠旧门槛（10 条）漏过去了。
  # growth_spike / score_surge 自带绝对增量门槛，不受这条影响。
  # 阈值是初始假设，未校准；改这里不用改代码。
  alert_min_items: 20
  alert_min_total_score: 5.0
  # 重复出现窗口（小时，2026-11-15）：同名事件在窗口内已跨平台出现过，
  # 再出现就不发提醒、排名里也不给爆发加分和新鲜度分。代价：同一标题的
  # 真新事件在窗口期内也会被压住；窗口就是调这个的旋钮。
  recurrence_window_hours: 24

# 事件综合排名 Top N（聚合所有来源成一个榜，见 docs/TOP_EVENTS.md）：
# Dashboard 最上方显示。权重与半衰期都是初始假设，需用 1-2 周真实
# 数据校准；改权重不用改代码，改这里就行。没有这一节时用模块默认值。
ranking:
  top_n: 10
  weights:
    growth: 0.30
    member_strength: 0.20
    burst: 0.20
    cross_platform: 0.20
    novelty: 0.10
  freshness_half_life_hours: 24
  # hashtag 惩罚上限（综合分里的绝对扣分数，2026-11-16 20:28 截图后加）：
  # 事件名里 hashtag 占的字符比例越高扣得越多，扣满就是这个数。
  # 截图证据：Top 10 里 #2 纯 hashtag 印尼标题（占比约 0.93）、#3 小丑
  # （占比约 0.51），扣满 30 分后分别剩约 0 分和约 9 分、掉出前 3，
  # #1 真事件（占比 0）不受影响。2026-11-17 从 20 提到 30：
  # 11-16 简报里 hashtag 高的事件从 1 个变 2 个，20 分不够把它们
  # 压出 Top 5。初始假设，未校准。
  hashtag_penalty_max: 30.0
