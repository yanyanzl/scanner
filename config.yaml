# Global Trend Radar 配置
# 扫描间隔（分钟），Windows / macOS 本地运行，默认 15 分钟
# 免费优先：默认只启用 RSS + GDELT；其他来源需配置凭证后手动开启，
# 付费来源（X）只有在没有免费可选方案时才考虑开启。
scan_interval_minutes: 15
db_path: "data/trends.sqlite3"

# 权重是初始假设，需用真实数据校准
weights:
  growth: 0.30
  scale: 0.20
  acceleration: 0.20
  cross_platform: 0.20
  novelty: 0.10

sources:
  rss:
    enabled: true
    feeds:
      - "https://feeds.bbci.co.uk/news/world/rss.xml"
      - "https://feeds.bbci.co.uk/news/technology/rss.xml"
  gdelt:
    enabled: true
    query: "technology OR breaking news"
    max_records: 50
    # GDELT 单独放宽到每 60 分钟 1 次（不是每 15 分钟）：2026-11-15 连续 3 次
    # 失败（两次 HTTP 429、一次返回限流提示文本而非 JSON），见
    # trend_radar/adapters/gdelt.py。GDELT 没有互动量数据，降频对增长
    # 计算几乎没有损失；被限流后 gdelt.py 内部还会退避重试（最多 3 次）。
    interval_minutes: 60
  reddit:
    enabled: true  # 已开启：无凭证时 adapter 返回 [] 并记“未启用”，填好 REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET 后自动采集
    subreddits:
      - "worldnews"
      - "technology"
  youtube:
    enabled: true  # 已开启：无凭证时 adapter 返回 [] 并记“未启用”，填好 YOUTUBE_API_KEY 后自动采集
    queries:
      - "breaking news"
      - "technology"
    # YouTube 单独放宽到每 30 分钟 1 次（不是每 15 分钟）：2 个查询词 × 48 次/天 = 96 次搜索/天，
    # 搜索桶上限是 100 次/天（Google 官方配额，2026-06-01 起 search.list 单独成桶、每次 1 单位），留 4 次缓冲。
    # videos.list 每次 1 单位，共用池 10,000 units/天，96 次只占 96 units。配额每天太平洋时间午夜重置。
    # 原配置 2 词 × 96 次/天 = 192 次搜索/天，接通当天就可能超限。见 trend_radar/collector.py。
    interval_minutes: 30
  x:
    enabled: false  # 配置 X_BEARER_TOKEN 后改为 true（按付费服务处理）
    queries:
      - "breaking news"
  tiktok:
    enabled: false  # 需要官方授权数据接口，当前为预留 stub，不采集
    queries: []

# P3 Telegram 实时提醒（免费 Bot API）：爆发事件在 1 分钟内推送到 Telegram。
# 凭证不放这里，放本地 .env：TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID。
# 未配凭证时自动跳过、不发任何请求；enabled: false 可彻底关闭提醒。
# 设置步骤见 docs/P3_ALERTS.md。
telegram:
  enabled: true

# 标题自动翻译（免费）：非中文标题翻成中文再显示/提醒。
# 用 Google 免费翻译接口的非官方 client=gtx 端点，无需 key；可能被限流
# 或屏蔽，失败时自动回退到原标题，不影响采集。翻译结果缓存在数据库
# （items.title_zh / events.name_zh），同一标题只翻一次；每轮最多调
# max_per_round 次接口，中文标题不调接口、不占预算。见 docs/TRANSLATION.md。
translation:
  enabled: true
  target_lang: zh-CN
  max_per_round: 30
  # 两次翻译接口调用之间等 0.5 秒：免费接口对连续请求很敏感，
  # 30 条连发容易直接 429；慢一点反而更容易翻出来。失败不存 title_zh，
  # 下一轮会再试（见 collector.py）；中文标题不调接口、不占预算。

# P1 事件聚类 v0.1（本地 TF-IDF + 余弦相似度 + 并查集，无新依赖）
# similarity_threshold 是初始假设，需用真实多平台数据校准，见 docs/P1_CLUSTERING.md
clustering:
  similarity_threshold: 0.35
  min_platforms: 1
  time_window_hours: 24

# P2 准备：爆发检测阈值（初始假设，需用真实快照数据校准，见 docs/P2_PREP.md）
# growth_spike：最新 max_growth 相对上一轮翻 growth_multiplier 倍以上，
#   且绝对增量不小于 growth_min_delta；score_surge 同理；
# new_event_min_platforms：首次出现即跨 >= 该数个平台的事件视为爆发。
burst:
  growth_multiplier: 2.0
  growth_min_delta: 100.0
  score_multiplier: 2.0
  score_min_delta: 5.0
  new_event_min_platforms: 2
